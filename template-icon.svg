<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" rx="40"/>
  <!-- Kanban board outline -->
  <rect x="100" y="180" width="180" height="440" rx="12" fill="#e94560" opacity="0.9"/>
  <rect x="310" y="180" width="180" height="440" rx="12" fill="#0f3460" opacity="0.9"/>
  <rect x="520" y="180" width="180" height="440" rx="12" fill="#1b9b4e" opacity="0.9"/>
  <!-- Cards on first column -->
  <rect x="115" y="240" width="150" height="70" rx="8" fill="#ffffff" opacity="0.9"/>
  <rect x="115" y="330" width="150" height="70" rx="8" fill="#ffffff" opacity="0.85"/>
  <rect x="115" y="420" width="150" height="70" rx="8" fill="#ffffff" opacity="0.8"/>
  <!-- Cards on second column -->
  <rect x="325" y="240" width="150" height="70" rx="8" fill="#ffffff" opacity="0.9"/>
  <rect x="325" y="330" width="150" height="70" rx="8" fill="#ffffff" opacity="0.85"/>
  <!-- Cards on third column -->
  <rect x="535" y="240" width="150" height="70" rx="8" fill="#ffffff" opacity="0.9"/>
  <!-- Column labels -->
  <text x="190" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">To Do</text>
  <text x="400" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Doing</text>
  <text x="610" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Done</text>
  <!-- App name -->
  <text x="400" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">Kanboard</text>
</svg>
