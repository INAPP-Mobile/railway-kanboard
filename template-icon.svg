    <rect x="-210" y="-80" rx="10" width="80" height="35" fill="#E94560" opacity="0.6"/>
    <rect x="-40" y="-150" rx="10" width="80" height="35" fill="#1B9B4E"/>
    <rect x="-40" y="-95" rx="10" width="80" height="60" fill="#1B9B4E" opacity="0.6"/>
