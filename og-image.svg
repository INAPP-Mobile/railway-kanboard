      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Kanban board -->
  <g transform="translate(350, 40)">
    <rect x="0" y="0" width="220" height="380" rx="14" fill="#e94560" opacity="0.85"/>
    <rect x="240" y="0" width="220" height="380" rx="14" fill="#0f3460" opacity="0.85"/>
    <rect x="480" y="0" width="220" height="380" rx="14" fill="#1b9b4e" opacity="0.85"/>
    <rect x="15" y="60" width="190" height="60" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="15" y="135" width="190" height="60" rx="8" fill="#ffffff" opacity="0.85"/>
    <rect x="15" y="210" width="190" height="60" rx="8" fill="#ffffff" opacity="0.8"/>
    <rect x="255" y="60" width="190" height="60" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="255" y="135" width="190" height="60" rx="8" fill="#ffffff" opacity="0.85"/>
    <rect x="495" y="60" width="190" height="60" rx="8" fill="#ffffff" opacity="0.9"/>
    <text x="110" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">To Do</text>
