  <text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">Kanboard</text>
  <text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#a0a0b0">Open-Source Kanban Project Management</text>
  <text x="600" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#707080">Deploy on Railway in minutes</text>
